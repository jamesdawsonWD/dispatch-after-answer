[project]
name = "dispatch-after-answer"
version = "0.1.0"
description = "Outbound LiveKit call that dispatches the agent only after the callee answers"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.8",
    "livekit-api>=1.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 120

[tool.uv]
package = false
